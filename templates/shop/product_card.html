<article class="product-card">
  <a class="product-image" href="{{ product.get_absolute_url }}">
    {% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.name }}" width="400" height="432" loading="lazy" decoding="async">{% else %}<div class="product-placeholder placeholder-{{ product.category.slug }}"><span>{{ product.name|slice:':1' }}</span></div>{% endif %}
    {% if product.featured %}<span class="product-badge">Featured</span>{% endif %}
  </a>
  <div class="product-meta"><div><p class="product-category">{{ product.category.name }}</p><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3></div><p class="price">${{ product.price|floatformat:2 }}</p></div>
  <p class="stock-note">{% if product.is_in_stock %}In stock{% else %}Sold out{% endif %}</p>
</article>
